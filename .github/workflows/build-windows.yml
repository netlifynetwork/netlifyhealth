name: Build Netlify Health for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate application JavaScript
        run: node --check src/app.js
      - run: npm install
      - name: Build Windows installer
        run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Netlify-Health-Windows
          path: dist/*.exe
          if-no-files-found: error
