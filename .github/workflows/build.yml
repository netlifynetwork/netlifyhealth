name: Netlify Health CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native platform runners
        run: flutter create . --platforms=android,windows --project-name netlify_health
      - name: Restore supplied app icon
        shell: bash
        run: |
          python -c "import base64,pathlib; p=pathlib.Path('assets/branding'); (p/'app_icon.jpg').write_bytes(base64.b64decode((p/'app_icon.jpg.b64').read_text()))"
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    name: Android APK
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --platforms=android --project-name netlify_health
      - name: Restore supplied app icon
        shell: bash
        run: |
          python -c "import base64,pathlib; p=pathlib.Path('assets/branding'); (p/'app_icon.jpg').write_bytes(base64.b64decode((p/'app_icon.jpg.b64').read_text()))"
      - run: flutter pub get
      - run: dart run flutter_launcher_icons -f flutter_launcher_icons-android.yaml
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: netlify-health-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Windows bundle
    needs: analyze
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --platforms=windows --project-name netlify_health
      - name: Restore supplied app icon
        shell: bash
        run: |
          python -c "import base64,pathlib; p=pathlib.Path('assets/branding'); (p/'app_icon.jpg').write_bytes(base64.b64decode((p/'app_icon.jpg.b64').read_text()))"
      - run: flutter pub get
      - run: dart run flutter_launcher_icons -f flutter_launcher_icons-windows.yaml
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: netlify-health-windows
          path: build/windows/x64/runner/Release/
