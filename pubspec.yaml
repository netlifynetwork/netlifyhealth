name: netlify_health
description: Netlify Health cross-platform health and nutrition app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  supabase_flutter: ^2.16.0
  shared_preferences: 2.5.3
  fl_chart: 1.1.1
  intl: 0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.jpg
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: assets/branding/app_icon.jpg
    icon_size: 256
  macos:
    generate: true
    image_path: assets/branding/app_icon.jpg
  linux:
    generate: true
    image_path: assets/branding/app_icon.jpg
    icon_size: 512
